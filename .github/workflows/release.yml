name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish x64, hash, and SPDX
        shell: pwsh
        run: ./scripts/publish-release.ps1 -Version "${{ github.ref_name }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          ./installer/build-installer.ps1 -Version $version
          $setup = Get-ChildItem publish/setup -Filter "WinCleaner-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer exe was not produced" }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
          Add-Content -Path publish/SHA256SUMS.txt -Encoding ascii -Value "$hash  $($setup.Name)"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            This release is unsigned. Verify SHA256SUMS.txt before you run the files.
            WinCleaner-Setup is the installer. It downloads missing .NET 8 Desktop and VC++ runtimes, and replaces an existing WinCleaner install with a clean copy.
            There is no win-arm64 build. An ARM64 PC still asks before a system write.
          files: |
            publish/WinCleaner.exe
            publish/setup/WinCleaner-Setup-*.exe
            publish/SHA256SUMS.txt
            publish/WinCleaner.spdx.json
