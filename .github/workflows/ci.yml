name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WinCleaner.slnx

      - name: Build
        run: dotnet build WinCleaner.slnx -c Release --no-restore

      - name: Test
        run: dotnet test WinCleaner.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Format check
        run: dotnet format WinCleaner.slnx --verify-no-changes --no-restore

      # Coverlet line gate stays off until Core reaches 70% and ActionExecutor stays at or above 90%.
      # Last local measurement is in eng/coverage-baseline.txt. Do not set a threshold that fails this job.
      # win-arm64 is not built here. There is no windows-11-arm runner and no documented VM.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
