<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0D0D0D" />
  <title>WinCleaner — Page not found</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("wincleaner-theme");
        document.documentElement.setAttribute(
          "data-theme",
          saved === "light" ? "light" : "dark"
        );
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="https://emirttac.github.io/WinCleaner/css/styles.css?v=37" />
  <link rel="icon" href="https://emirttac.github.io/WinCleaner/favicon.ico" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="site-header">
    <a class="logo" href="https://emirttac.github.io/WinCleaner/" aria-label="WinCleaner home">
      <img src="https://emirttac.github.io/WinCleaner/icon.png" alt="" width="28" height="28" />
      <span>WinCleaner</span>
    </a>
  </header>
  <main id="top">
    <section class="hero" aria-labelledby="error-title">
      <div class="hero-stage">
        <div class="hero-content">
          <h1 id="error-title" class="hero-brand">404</h1>
          <p class="hero-lead">This page isn’t on the WinCleaner site. The live product page is case-sensitive:</p>
          <p class="hero-lead">Bu sayfa WinCleaner sitesinde yok. Açık adres büyük/küçük harfe duyarlıdır:</p>
          <div class="hero-actions">
            <a class="btn btn-accent" href="https://emirttac.github.io/WinCleaner/">emirttac.github.io/WinCleaner</a>
            <a class="btn btn-ghost" href="https://emirttac.github.io/WinCleaner/#download">Download</a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
